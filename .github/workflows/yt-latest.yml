# The home page's latest YouTube videos: every hour, read the channel's feed (tools/yt_latest.py) and, when a new
# video is up, commit yt-latest.json; GitHub Pages then publishes it. Can also be run by hand from the Actions tab.
name: Latest YouTube videos

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: yt-latest

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel's latest videos
        run: python3 tools/yt_latest.py
      - name: Commit them if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- yt-latest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yt-latest.json
          git commit -m "Latest YouTube videos"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
