# The home page's latest Instagram posts: every hour, read the account's newest posts through Meta's Instagram API
# (tools/ig_latest.py, with the IG_TOKEN secret) and, when there is a new one, commit ig-latest.json and the pictures
# in img/ig/; GitHub Pages then publishes them. Also runs when this file or the script is pushed, and can be run by
# hand from the Actions tab. Until the IG_TOKEN secret is set (tools/README.md says how), it does nothing.
name: Latest Instagram posts

on:
  schedule:
    - cron: '53 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/ig-latest.yml
      - tools/ig_latest.py
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ig-latest

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the latest posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/ig_latest.py
      - name: Commit them if they changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- ig-latest.json img)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ig-latest.json img
          git commit -m "Latest Instagram posts"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
